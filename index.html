<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f6f1e7" />

  <title>My Books</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =========================
       本棚画面
  ========================== -->
  <main
    id="library"
    class="screen active"
    aria-label="本棚"
  >

    <header class="library-header">

      <div>

        <p class="eyebrow">
          MY LIBRARY
        </p>

        <h1>
          本棚
        </h1>

        <p class="sub">
          学んだチャットを、本として読み返す。
        </p>

      </div>

    </header>


    <!-- =========================
         本一覧
    ========================== -->
    <section
      class="shelf"
      aria-label="本の一覧"
    >


      <!-- =========================
           1冊目
      ========================== -->
      <button
        class="book-card"
        type="button"

        data-book="mindfulness"

        data-title="不安をなくす究極のマインドフルネス"

        data-subtitle="4分割理解・記憶シート"

        data-file="mindfulness.md"

        aria-label="不安をなくす究極のマインドフルネスを開く"
      >

        <div class="book-cover cover-green">

          <span class="book-kicker">
            4分割理解・記憶シート
          </span>

          <strong>
            不安をなくす
            <br>
            究極の
            <br>
            マインドフルネス
          </strong>

          <span class="book-meta">
            第1章〜第5章
          </span>

        </div>


        <div class="book-info">

          <h2>
            不安をなくす究極のマインドフルネス
          </h2>

          <p>
            タップしてチャット内容を読む
          </p>

        </div>

      </button>



      <!-- =========================
           2冊目
      ========================== -->
      <button
        class="book-card"
        type="button"

        data-book="structuralism"

        data-title="寝ながら学べる構造主義"

        data-subtitle="4分割理解・記憶シート"

        data-file="structuralism.md"

        aria-label="寝ながら学べる構造主義を開く"
      >

        <div class="book-cover cover-navy">

          <span class="book-kicker">
            内田樹・4分割理解
          </span>

          <strong>
            寝ながら
            <br>
            学べる
            <br>
            構造主義
          </strong>

          <span class="book-meta">
            全章・全セクション
          </span>

        </div>


        <div class="book-info">

          <h2>
            寝ながら学べる構造主義
          </h2>

          <p>
            タップしてチャット内容を読む
          </p>

        </div>

      </button>


    </section>

  </main>



  <!-- =========================
       本文を読む画面
  ========================== -->
  <main
    id="reader"
    class="screen"
    aria-label="読書画面"
  >


    <!-- 上部バー -->
    <header class="reader-header">


      <!-- 本棚へ戻る -->
      <button
        id="backBtn"
        class="icon-btn"
        type="button"
        aria-label="本棚に戻る"
      >
        ←
      </button>



      <!-- 本タイトル -->
      <div class="reader-title-wrap">

        <p
          id="readerTitle"
          class="reader-title"
        >
        </p>

        <p
          id="readerSubtitle"
          class="reader-subtitle"
        >
        </p>

      </div>



      <!-- 検索ボタン -->
      <button
        id="searchBtn"
        class="icon-btn"
        type="button"
        aria-label="本文を検索"
      >
        ⌕
      </button>


    </header>



    <!-- =========================
         読書進捗バー
    ========================== -->
    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      >
      </div>

    </div>



    <!-- =========================
         検索欄
    ========================== -->
    <section
      id="searchPanel"
      class="search-panel"
      hidden
    >

      <input
        id="searchInput"
        type="search"
        placeholder="本の中を検索"
        autocomplete="off"
      />

      <span id="searchCount">
      </span>

    </section>



    <!-- =========================
         チャット本文
    ========================== -->
    <article
      id="chat"
      class="chat"
      aria-live="polite"
    >

      <div class="loading">
        本を開いています…
      </div>

    </article>



    <!-- =========================
         一番上へ戻るボタン
    ========================== -->
    <button
      id="topBtn"
      class="top-btn"
      type="button"
      aria-label="一番上へ戻る"
    >
      ↑
    </button>


  </main>



  <!-- =========================
       Markdown表示用
  ========================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =========================
       HTML安全化
  ========================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
  ></script>


  <!-- =========================
       アプリ本体
  ========================== -->
  <script src="app.js"></script>


</body>

</html>
